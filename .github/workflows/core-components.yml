name: Core Components                          # 1. WORKFLOW

on:                                            # 2. EVENTS
  push:
    branches:
      - main
  workflow_dispatch:

jobs:                                          # 3. JOBS
  build:                                       # Job 1
    runs-on: ubuntu-latest                     # 6. RUNNER (GitHub-hosted VM)
    steps:                                     # 4. STEPS
      - name: Checkout repository
        uses: actions/checkout@v4              # 5. ACTION (reusable unit)

      - name: Prove the action worked
        run: ls -la

      - name: Show the 6 core components
        run: |
          echo "1. WORKFLOW : $GITHUB_WORKFLOW"
          echo "2. EVENT    : $GITHUB_EVENT_NAME"
          echo "3. JOB      : $GITHUB_JOB"
          echo "4. STEP     : this run: step executing a shell command"
          echo "5. ACTION   : actions/checkout@v4"
          echo "6. RUNNER   : $RUNNER_OS ($RUNNER_NAME)"

  test:                                        # Job 2
    runs-on: ubuntu-latest
    needs: build                               # Jobs are parallel by default; needs makes it sequential
    steps:
      - name: Confirm job dependency
        run: echo "Job 2 ran after Job 1 because of needs"