name: Scheduled Workflow

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  scheduled-job:
    runs-on: ubuntu-latest

    steps:
      - name: Show scheduled run
        run: |
          echo "Scheduled workflow executed!"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"