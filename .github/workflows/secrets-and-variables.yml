name: Secrets and Variables

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # Part 1 - configuration variables (vars context)
  variables-demo:
    name: Configuration Variables
    runs-on: ubuntu-latest
    steps:
      - name: Print repository variables
        run: |
          echo "APP_NAME     = ${{ vars.APP_NAME }}"
          echo "DEPLOY_ENV   = ${{ vars.DEPLOY_ENV }}"
          echo "DEMO_VARIABLE = ${{ vars.DEMO_VARIABLE }}"

  # Part 2 - encrypted secrets (secrets context)
  secrets-demo:
    name: Encrypted Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Pass secret into a step
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Trying to print the secret - $MY_SECRET"
          echo "Secret length is ${#MY_SECRET} characters"
          echo "The secret is available to the step but masked in the log"

  # Part 3 - GITHUB_TOKEN for REST API calls and git operations
  github-token-demo:
    name: GITHUB_TOKEN Authentication
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: REST API call - read repository info
        run: |
          curl -s -o repo.json -w "HTTP status %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}
          grep '"full_name"' repo.json

      - name: REST API call - create an issue
        run: |
          curl -s -X POST -o issue.json -w "HTTP status %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d '{"title":"Issue created by GITHUB_TOKEN","body":"Created automatically by workflow run ${{ github.run_id }}"}'
          grep '"html_url"' issue.json | head -1

      - name: Git operation - push a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b token-demo-${{ github.run_number }}
          echo "Created by workflow run ${{ github.run_id }}" > token-demo.txt
          git add token-demo.txt
          git commit -m "Add token-demo.txt using GITHUB_TOKEN"
          git push origin HEAD