
name: Hello GitHub Actions

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  repository_dispatch:
    types: [external_test]

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print greeting
        run: echo "Hello from GitHub Actions!"

      - name: Show event details
        run: |
          echo "Triggered by: $GITHUB_ACTOR"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF"

      - name: Test pull request
        if: github.event_name == 'pull_request'
        run: echo "Pull request trigger is working!"

      - name: Test repository dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          MESSAGE: ${{ github.event.client_payload.message }}
        run: |
          echo "Repository dispatch trigger is working!"
          echo "Message: $MESSAGE"
          echo "Event type: ${{ github.event.action }}"


      - name: Show workflow contexts
        env:
          REPOSITORY_VARIABLE: ${{ vars.DEMO_VARIABLE }}
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Repository variable: $REPOSITORY_VARIABLE"

      - name: Check event condition
        if: ${{ contains(fromJSON('["push","pull_request","repository_dispatch"]'), github.event_name) }}
        run: echo "The event matches our condition!"

      - name: Run on success
        if: ${{ success() }}
        run: echo "Previous steps succeeded!"

      - name: Always run this step
        if: ${{ always() }}
        run: echo "This step runs even if an earlier step fails or is cancelled."

