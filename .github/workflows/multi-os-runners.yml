name: Multi-OS Runners

on:
  workflow_dispatch:

jobs:
  ubuntu-job:
    name: Ubuntu runner
    runs-on: ubuntu-latest
    steps:
      - name: Show Ubuntu details
        run: |
          echo "Runner OS - $RUNNER_OS"
          cat /etc/os-release
          uname -a

  windows-job:
    name: Windows runner (Choco and PowerShell)
    runs-on: windows-latest
    steps:
      - name: Show Windows details (PowerShell)
        shell: powershell
        run: |
          Write-Host "Runner OS - $env:RUNNER_OS"
          Write-Host "OS version - $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell version - $($PSVersionTable.PSVersion)"

      - name: Install a package with Chocolatey
        shell: powershell
        run: |
          choco --version
          $attempts = 0
          do {
            $attempts++
            choco install wget -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Attempt $attempts failed, retrying in 15 seconds..."
            Start-Sleep -Seconds 15
          } while ($attempts -lt 4)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          choco list --local-only
          wget.exe --version

  macos-job:
    name: macOS runner (Swift compilation)
    runs-on: macos-latest
    steps:
      - name: Show macOS details
        run: |
          echo "Runner OS - $RUNNER_OS"
          sw_vers
          swift --version

      - name: Compile and run a Swift program
        run: |
          cat > hello.swift << 'EOF'
          print("Hello from Swift on macOS!")
          EOF
          swiftc hello.swift -o hello
          ./hello