name: Multi-OS Runners

on:
  workflow_dispatch:

jobs:
  ubuntu-job:
    name: Ubuntu runner
    runs-on: ubuntu-latest
    steps:
      - name: Show Ubuntu details
        run: |
          echo "Runner OS - $RUNNER_OS"
          cat /etc/os-release
          uname -a

  windows-job:
    name: Windows runner (Choco and PowerShell)
    runs-on: windows-latest
    steps:
      - name: Show Windows details (PowerShell)
        shell: powershell
        run: |
          Write-Host "Runner OS - $env:RUNNER_OS"
          Write-Host "OS version - $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell version - $($PSVersionTable.PSVersion)"

      - name: Install a package with Chocolatey
        shell: powershell
        run: |
          choco --version
          $shim = "C:\ProgramData\chocolatey\bin\wget.exe"
          $installed = $false
          foreach ($i in 1..5) {
            Write-Host "Attempt $i of 5"
            choco install wget -y --no-progress
            if (Test-Path $shim) { $installed = $true; break }
            Write-Host "wget.exe not found, waiting before retry..."
            Start-Sleep -Seconds (20 * $i)
          }
          choco list
          if ($installed) {
            & $shim --version | Select-Object -First 1
          } else {
            Write-Host "Chocolatey feed still unavailable"
            exit 1
          }

  macos-job:
    name: macOS runner (Swift compilation)
    runs-on: macos-latest
    steps:
      - name: Show macOS details
        run: |
          echo "Runner OS - $RUNNER_OS"
          sw_vers
          swift --version

      - name: Compile and run a Swift program
        run: |
          cat > hello.swift << 'EOF'
          print("Hello from Swift on macOS!")
          EOF
          swiftc hello.swift -o hello
          ./hello