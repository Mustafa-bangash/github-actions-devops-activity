name: Module 3 Step 1 - Core Components      # 1. WORKFLOW

on:                                          # 2. EVENT
  workflow_dispatch:

jobs:                                        # 3. JOBS
  build:                                     # Job 1
    runs-on: ubuntu-latest                   # 6. RUNNER
    steps:                                   # 4. STEPS
      - name: Checkout repository
        uses: actions/checkout@v4            # 5. ACTION

      - name: Show workflow architecture
        run: |
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Job: $GITHUB_JOB"
          echo "Runner: $RUNNER_OS"
          echo "Action used: actions/checkout@v4"

  test:                                      # Job 2
    runs-on: ubuntu-latest
    needs: build                             # waits for Job 1
    steps:
      - name: Confirm job dependency
        run: echo "Job 2 ran after Job 1 because of needs"