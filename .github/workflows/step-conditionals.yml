name: Step Conditionals

on:
  workflow_dispatch:

jobs:
 
  conditionals:
    name: contains, success and always
    runs-on: ubuntu-latest
    steps:
      - name: contains() - branch ref
        if: ${{ contains(github.ref, 'main') }}
        run: echo "contains() is true - running on main"

      - name: contains() - event name
        if: ${{ contains(github.event_name, 'workflow_dispatch') }}
        run: echo "contains() is true - manual trigger"

      - name: success()
        if: ${{ success() }}
        run: echo "success() is true - previous steps succeeded"

      - name: always()
        if: ${{ always() }}
        run: echo "always() step executed"

  # Job 2: failure() needs a failed step, so this job fails on purpose
  failure-demo:
    name: failure demo (intentional)
    runs-on: ubuntu-latest
    continue-on-error: true    # keeps the overall workflow run green
    steps:
      - name: Step that fails on purpose
        run: |
          echo "Simulating a failure"
          exit 1

      - name: success() - skipped
        if: ${{ success() }}
        run: echo "You will NOT see this"

      - name: failure() - runs
        if: ${{ failure() }}
        run: echo "failure() is true - a previous step failed"

      - name: always() - runs
        if: ${{ always() }}
        run: echo "always() ran regardless"